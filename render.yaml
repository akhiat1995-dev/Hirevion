services:
  # Backend API
  - type: web
    name: hirevion-backend
    env: python
    region: oregon
    plan: free
    rootDir: BACKEND
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GROQ_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://hirevion-frontend.onrender.com

  # Frontend React App
  - type: web
    name: hirevion-frontend
    env: static
    region: oregon
    plan: free
    rootDir: FRONTEND
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://hirevion-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
