<!-- Hirevion Logo - Monochrome (Single Color) -->
<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Pencil Icon -->
  <g transform="translate(10, 10)">
    <rect x="0" y="5" width="30" height="10" fill="currentColor" rx="2"/>
    <polygon points="30,5 38,10 30,15" fill="currentColor"/>
    <polygon points="38,10 42,10 38,8 38,12" fill="currentColor"/>
    <rect x="5" y="8" width="20" height="4" fill="currentColor" opacity="0.4" rx="1"/>
  </g>
  
  <!-- Brand Name -->
  <text x="55" y="38" font-family="'Playfair Display', serif" font-size="32" font-weight="700" fill="currentColor" letter-spacing="-0.5">
    Hirevion
  </text>
  
  <!-- Tagline -->
  <text x="55" y="52" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="currentColor" opacity="0.7" letter-spacing="1.5">
    AI-POWERED HIRING
  </text>
  
  <!-- Pencil Stroke -->
  <path d="M 55 42 Q 100 45, 180 42" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
